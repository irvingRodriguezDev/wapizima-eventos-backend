AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: API Serverless para venta de boletos - Wapizima

Globals:
  Function:
    Timeout: 15
    Runtime: nodejs18.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        DB_HOST: "IP_O_HOST_DE_TU_INSTANCIA"
        DB_USER: "tu_usuario"
        DB_PASSWORD: "tu_password"
        DB_NAME: "wapizima_boletos"
        RESEND_API_KEY: "re_tu_apikey_aqui"

Resources:
  # API Gateway Principal con CORS habilitado para React
  WapizimaBoletosApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
        AllowOrigin: "'*'"

  # 1. Lambda para Eventos (Index y Detalle)
  EventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/events.handler
      Events:
        GetEvents:
          Type: Api
          Properties:
            Path: /eventos
            Method: get
            RestApiId: !Ref WapizimaBoletosApi
        GetEventDetail:
          Type: Api
          Properties:
            Path: /eventos/{slug}
            Method: get
            RestApiId: !Ref WapizimaBoletosApi

  # 2. Lambda para Pagos y Reservas
  PaymentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/payments.handler
      Events:
        CreateOrder:
          Type: Api
          Properties:
            Path: /reservar
            Method: post
            RestApiId: !Ref WapizimaBoletosApi
        PaymentWebhook:
          Type: Api
          Properties:
            Path: /webhook/pago
            Method: post
            RestApiId: !Ref WapizimaBoletosApi

  # 3. Lambda para Tickets (Buscador y Validación)
  TicketsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/handlers/tickets.handler
      Events:
        SearchTickets:
          Type: Api
          Properties:
            Path: /buscar-boletos
            Method: get
            RestApiId: !Ref WapizimaBoletosApi
